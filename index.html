<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Universal Media Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: #090a0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px 40px;
        }

        /* Top Bar */
        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 25px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #00f2fe;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .badge-pro {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #000;
            font-size: 10px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        /* Platform Selector Tabs */
        .platform-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 25px;
        }

        .platform-card {
            background: #13151f;
            border: 1px solid #222638;
            border-radius: 16px;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .platform-card i { font-size: 26px; color: #7e859b; transition: 0.3s; }
        .platform-card span { font-size: 12px; font-weight: 700; color: #7e859b; transition: 0.3s; }

        .platform-card.active {
            background: #1a1d2e;
            border-color: #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
            transform: translateY(-2px);
        }

        .platform-card.active i { color: #00f2fe; }
        .platform-card.active span { color: #ffffff; }

        /* Main Container */
        .main-card {
            width: 100%;
            max-width: 600px;
            background: #13151f;
            border: 1px solid #222638;
            border-radius: 24px;
            padding: 30px 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .hero-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            text-align: center;
        }

        .hero-subtitle {
            color: #7e859b;
            font-size: 13px;
            text-align: center;
            margin-bottom: 25px;
        }

        /* Large Input Field with Paste Button */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 18px 100px 18px 18px;
            background: #090a0f;
            border: 2px solid #222638;
            border-radius: 16px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: 0.3s;
        }

        .input-wrapper input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .btn-paste {
            position: absolute;
            right: 8px;
            background: #222638;
            color: #00f2fe;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-paste:hover { background: #00f2fe; color: #000; }

        /* Fetch Button */
        .btn-download {
            width: 100%;
            padding: 18px;
            border: none;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #000;
            font-size: 16px;
            font-weight: 800;
            border-radius: 16px;
            cursor: pointer;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
            transition: 0.3s;
        }

        .btn-download:active { transform: scale(0.98); }

        /* Video Preview Area (Appears after fetch) */
        .preview-box {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #222638;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .video-info {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        .video-thumb {
            width: 90px;
            height: 90px;
            border-radius: 12px;
            object-fit: cover;
            background: #090a0f;
        }

        .video-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .video-title {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-author { font-size: 12px; color: #7e859b; }

        /* Download Options Grid */
        .download-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dl-link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: #1a1d2e;
            border: 1px solid #282d47;
            border-radius: 14px;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: 0.3s;
        }

        .dl-link-btn:hover { border-color: #00f2fe; background: #22273f; }
        .dl-link-btn i { color: #00f2fe; }

        /* How It Works Section */
        .how-section {
            width: 100%;
            max-width: 600px;
            background: #13151f;
            border: 1px solid #222638;
            border-radius: 24px;
            padding: 25px 22px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #00f2fe;
        }

        .steps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            text-align: center;
        }

        .step-item {
            background: #090a0f;
            padding: 16px 10px;
            border-radius: 16px;
            border: 1px solid #1c1f30;
        }

        .step-number {
            width: 28px;
            height: 28px;
            background: #1f2438;
            color: #00f2fe;
            font-size: 12px;
            font-weight: 800;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
        }

        .step-text { font-size: 11px; color: #a0a5b8; font-weight: 600; line-height: 1.4; }

        /* Status & Toast Messages */
        #statusText { margin-top: 15px; font-size: 13px; font-weight: 600; text-align: center; }

        /* Ad Modal */
        .ad-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; align-items: center; justify-content: center; flex-direction: column; }
        .ad-header { position: absolute; top: 15px; right: 15px; z-index: 10000; }
        .close-ad-btn { background: rgba(0,0,0,0.85); color: #00f2fe; border: 2px solid #00f2fe; padding: 10px 20px; border-radius: 25px; font-size: 13px; font-weight: bold; }
        .ad-iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- Header Logo -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-cloud-arrow-down"></i> SAVEPRO
        </div>
        <span class="badge-pro">ULTRA HD</span>
    </header>

    <!-- Platform Selector Bar -->
    <div class="platform-bar">
        <div class="platform-card active" onclick="switchPlatform('TikTok', this, 'Paste TikTok Link Here!')">
            <i class="fa-brands fa-tiktok"></i>
            <span>TikTok</span>
        </div>
        <div class="platform-card" onclick="switchPlatform('YouTube', this, 'Paste YouTube Link Here!')">
            <i class="fa-brands fa-youtube"></i>
            <span>YouTube</span>
        </div>
        <div class="platform-card" onclick="switchPlatform('Snapchat', this, 'Paste Snapchat Link Here!')">
            <i class="fa-brands fa-snapchat"></i>
            <span>Snapchat</span>
        </div>
        <div class="platform-card" onclick="switchPlatform('Facebook', this, 'Paste Facebook Link Here!')">
            <i class="fa-brands fa-facebook"></i>
            <span>Facebook</span>
        </div>
    </div>

    <!-- Main Card -->
    <div class="main-card">
        <h1 class="hero-title" id="platformTitle">TikTok Downloader</h1>
        <p class="hero-subtitle">Fast, Free & Watermark-Free HD Downloads</p>

        <div class="input-wrapper">
            <input type="text" id="urlInput" placeholder="Paste TikTok Link Here!">
            <button class="btn-paste" onclick="pasteFromClipboard()">
                <i class="fa-regular fa-clipboard"></i> Paste
            </button>
        </div>

        <button class="btn-download" onclick="startProcess()">
            <i class="fa-solid fa-bolt"></i> Extract Media
        </button>

        <div id="statusText"></div>

        <!-- Result Preview & Download Box -->
        <div class="preview-box" id="previewBox">
            <div class="video-info">
                <img src="" id="videoThumb" class="video-thumb" alt="Thumbnail">
                <div class="video-details">
                    <div class="video-title" id="videoTitle">Video Title Here</div>
                    <div class="video-author" id="videoAuthor">@author</div>
                </div>
            </div>

            <div class="download-options" id="downloadOptions">
                <!-- Links injected dynamically -->
            </div>
        </div>
    </div>

    <!-- How It Works Section -->
    <div class="how-section">
        <div class="section-title">
            <i class="fa-solid fa-circle-info"></i> How to Download
        </div>
        <div class="steps-grid">
            <div class="step-item">
                <div class="step-number">1</div>
                <div class="step-text">Copy link from TikTok, YouTube, etc.</div>
            </div>
            <div class="step-item">
                <div class="step-number">2</div>
                <div class="step-text">Paste link into input box above</div>
            </div>
            <div class="step-item">
                <div class="step-number">3</div>
                <div class="step-text">Click Extract & save file instantly</div>
            </div>
        </div>
    </div>

    <!-- Ad Modal -->
    <div class="ad-modal" id="adModal">
        <div class="ad-header">
            <button class="close-ad-btn" id="closeAdBtn" onclick="closeAdModal()">Reward in (5s)</button>
        </div>
        <iframe id="adFrame" class="ad-iframe" src=""></iframe>
    </div>

    <script>
        const adSmartLink = "https://araplhn.org/4/718787872bf62907dd99606e2222b500";
        let countdownTimer;

        function switchPlatform(platform, element, placeholderText) {
            document.querySelectorAll('.platform-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('platformTitle').innerText = platform + ' Downloader';
            document.getElementById('urlInput').placeholder = placeholderText;
            document.getElementById('previewBox').style.display = 'none';
            document.getElementById('statusText').innerHTML = '';
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if(text) {
                    document.getElementById('urlInput').value = text;
                }
            } catch (err) {
                alert('Please allow Clipboard access or paste manually.');
            }
        }

        function startProcess() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const statusText = document.getElementById('statusText');

            if (!urlInput) {
                statusText.style.color = '#ff3b30';
                statusText.innerHTML = '⚠️ Please paste a valid link first!';
                return;
            }

            showRewardedAd();
        }

        function showRewardedAd() {
            const modal = document.getElementById('adModal');
            const iframe = document.getElementById('adFrame');
            const closeBtn = document.getElementById('closeAdBtn');
            
            iframe.src = adSmartLink;
            modal.style.display = 'flex';

            let timeLeft = 5;
            closeBtn.disabled = true;
            closeBtn.innerText = `Reward in (${timeLeft}s)`;

            countdownTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    closeBtn.innerText = `Reward in (${timeLeft}s)`;
                } else {
                    clearInterval(countdownTimer);
                    closeBtn.disabled = false;
                    closeBtn.innerText = '✕ Get File';
                    closeBtn.style.background = '#00f2fe';
                    closeBtn.style.color = '#000';
                }
            }, 1000);
        }

        function closeAdModal() {
            document.getElementById('adModal').style.display = 'none';
            document.getElementById('adFrame').src = '';
            fetchDownload();
        }

        async function fetchDownload() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const statusText = document.getElementById('statusText');
            const previewBox = document.getElementById('previewBox');

            statusText.style.color = '#00f2fe';
            statusText.innerHTML = '⏳ Extracting video details...';
            previewBox.style.display = 'none';

            try {
                const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                const data = await res.json();

                if (data && data.code === 0) {
                    statusText.innerHTML = '';
                    
                    document.getElementById('videoThumb').src = data.data.cover || 'https://via.placeholder.com/90';
                    document.getElementById('videoTitle').innerText = data.data.title || 'HD Video Content';
                    document.getElementById('videoAuthor').innerText = '@' + (data.data.author.unique_id || 'creator');

                    const optionsBox = document.getElementById('downloadOptions');
                    optionsBox.innerHTML = `
                        <a href="${data.data.play}" class="dl-link-btn" target="_blank" download>
                            <span><i class="fa-solid fa-film"></i> Download No-Watermark HD</span>
                            <i class="fa-solid fa-download"></i>
                        </a>
                        <a href="${data.data.wmplay || data.data.play}" class="dl-link-btn" target="_blank" download>
                            <span><i class="fa-solid fa-video"></i> Download Normal SD</span>
                            <i class="fa-solid fa-download"></i>
                        </a>
                        <a href="${data.data.music}" class="dl-link-btn" target="_blank" download>
                            <span><i class="fa-solid fa-music"></i> Audio Only (MP3)</span>
                            <i class="fa-solid fa-download"></i>
                        </a>
                    `;

                    previewBox.style.display = 'block';
                } else {
                    statusText.style.color = '#ff3b30';
                    statusText.innerHTML = '❌ Link is invalid or private.';
                }
            } catch (err) {
                statusText.style.color = '#ff3b30';
                statusText.innerHTML = '❌ Unable to connect to server.';
            }
        }
    </script>
</body>
</html>
