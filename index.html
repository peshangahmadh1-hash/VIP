<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Full Rainbow RGB Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

        /* Full Animated Rainbow Keyframes */
        @keyframes rainbowFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes rainbowRotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 0, 128, 0.6), 0 0 30px rgba(0, 255, 255, 0.4); }
            50% { box-shadow: 0 0 25px rgba(0, 255, 0, 0.8), 0 0 45px rgba(255, 255, 0, 0.6); }
        }

        body { 
            background: #030307; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 15px 12px; 
            user-select: none; 
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Dynamic Background Glow */
        body::before {
            content: "";
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,0,128,0.15) 0%, rgba(0,255,255,0.15) 30%, rgba(0,255,0,0.1) 60%, transparent 80%);
            animation: rainbowRotate 10s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        header { width: 100%; max-width: 480px; display: flex; justify-content: center; align-items: center; padding: 10px 0 15px 0; }
        
        /* Multi-Color Animated Header Logo */
        .logo { 
            font-size: 22px; 
            font-weight: 900; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            background: linear-gradient(90deg, #ff0055, #ff00ff, #00ffff, #00ff00, #ffff00, #ff0055);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowFlow 3s linear infinite;
            text-shadow: 0 0 20px rgba(0,255,255,0.5);
        }

        /* Icon Grid Bar above Input */
        .social-icons-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 480px; margin-bottom: 20px; }
        
        /* Individual RGB Card Wrappers */
        .icon-card-wrapper {
            padding: 2px;
            border-radius: 18px;
            background: linear-gradient(135deg, #ff0000, #ff00ff, #00ffff, #00ff00, #ffff00, #ff0000);
            background-size: 300% 300%;
            animation: rainbowFlow 4s linear infinite;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .icon-card-wrapper:active { transform: scale(0.95); }

        .icon-card { 
            background: #090812; 
            border-radius: 16px; 
            padding: 14px 4px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
            height: 100%;
        }

        .icon-card i { 
            font-size: 28px; 
            background: linear-gradient(90deg, #ff0055, #00ffff, #ffff00);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowFlow 3s linear infinite;
        }

        .icon-card span { 
            font-size: 11px; 
            font-weight: 900; 
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ffffff, #8888aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Active Card Glow Effect */
        .icon-card-wrapper.active {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 30px rgba(255, 0, 255, 0.6);
            animation: rainbowFlow 1.5s linear infinite, pulseGlow 2s infinite alternate;
        }

        /* Main Animated Rainbow Card Outer */
        .main-card-wrapper {
            width: 100%;
            max-width: 480px;
            padding: 3px;
            border-radius: 26px;
            background: linear-gradient(135deg, #ff0000, #ff00ff, #00ffff, #00ff00, #ffff00, #ff0000);
            background-size: 400% 400%;
            animation: rainbowFlow 4s linear infinite, pulseGlow 3s infinite alternate;
        }

        .main-card { 
            width: 100%; 
            background: #090812; 
            border-radius: 24px; 
            padding: 24px 18px; 
            text-align: center; 
        }
        
        h1 { 
            font-size: 22px; 
            margin-bottom: 6px; 
            background: linear-gradient(90deg, #00ffff, #ff00ff, #ffff00, #00ff00);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowFlow 3s linear infinite;
            font-weight: 900;
        }

        .hero-desc { 
            color: #a0a0c0; 
            font-size: 12px; 
            margin-bottom: 20px; 
            font-weight: 600;
        }

        /* Input Container with Dynamic Rainbow Glow */
        .input-group { 
            position: relative; 
            margin-bottom: 20px; 
            padding: 2px; 
            border-radius: 16px; 
            background: linear-gradient(90deg, #ff0000, #ff00ff, #00ffff, #00ff00, #ffff00, #ff0000); 
            background-size: 300% 300%; 
            animation: rainbowFlow 2s linear infinite; 
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        
        input[type="text"] { 
            width: 100%; 
            padding: 16px 14px; 
            background: #040308; 
            border: none; 
            border-radius: 14px; 
            color: #ffffff; 
            font-size: 14px; 
            font-weight: bold;
            outline: none; 
            text-align: center; 
            transition: 0.3s; 
        }
        
        input[type="text"]::placeholder {
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowFlow 3s linear infinite;
            font-weight: bold;
        }

        /* Quality Selectors */
        .quality-title { 
            font-size: 12px; 
            margin-bottom: 10px; 
            text-align: left; 
            font-weight: 900;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .quality-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        
        .quality-btn-wrapper {
            padding: 2px;
            border-radius: 14px;
            background: #222;
            transition: 0.3s;
        }

        .quality-btn-wrapper.active {
            background: linear-gradient(90deg, #ff0000, #00ffff, #00ff00, #ff0000);
            background-size: 300% 300%;
            animation: rainbowFlow 2s linear infinite;
            box-shadow: 0 0 12px rgba(0,255,255,0.6);
        }

        .quality-btn { 
            width: 100%;
            padding: 11px 4px; 
            background: #040308; 
            border: none;
            border-radius: 12px; 
            color: #fff; 
            font-size: 11px; 
            font-weight: bold; 
            cursor: pointer; 
        }

        /* Full Multi-Color Animated Rainbow Download Button */
        .btn-download-wrapper {
            padding: 3px;
            border-radius: 16px;
            background: linear-gradient(90deg, #ff0000, #ff00ff, #00ffff, #00ff00, #ffff00, #ff0000);
            background-size: 300% 300%;
            animation: rainbowFlow 2s linear infinite, pulseGlow 2s infinite alternate;
            cursor: pointer;
        }

        .btn-download { 
            width: 100%; 
            padding: 16px; 
            border: none; 
            background: #040308; 
            color: #fff; 
            font-size: 15px; 
            font-weight: 900; 
            border-radius: 14px; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-download span {
            background: linear-gradient(90deg, #ff0000, #ff00ff, #00ffff, #00ff00, #ffff00);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowFlow 2s linear infinite;
        }

        .btn-download i {
            color: #00ffff;
            animation: rainbowRotate 3s linear infinite;
        }

        .btn-download-wrapper:active { transform: scale(0.97); }

        #statusText { margin-top: 18px; font-size: 13px; line-height: 1.5; font-weight: bold; }

        /* In-App Ad Modal */
        .ad-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; align-items: center; justify-content: center; flex-direction: column; }
        .ad-header { position: absolute; top: 12px; right: 12px; z-index: 10000; }
        .close-ad-btn { background: rgba(0,0,0,0.8); color: #00ff88; border: 2px solid #00ff88; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; box-shadow: 0 0 10px #00ff88; }
        .ad-iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-bolt"></i> ULTRA RAINBOW RGB DOWNLOADER</div>
    </header>

    <!-- Rainbow Social Icons Bar -->
    <div class="social-icons-bar">
        <div class="icon-card-wrapper active" onclick="switchPlatform('TikTok', this, 'Paste Tiktok Link Here!', 'Download No-Watermark TikTok Videos Ultra Fast')">
            <div class="icon-card">
                <i class="fa-brands fa-tiktok"></i>
                <span>TikTok</span>
            </div>
        </div>
        <div class="icon-card-wrapper" onclick="switchPlatform('YouTube', this, 'Paste Youtube Link Here!', 'Download High Quality YouTube Videos & Audio')">
            <div class="icon-card">
                <i class="fa-brands fa-youtube"></i>
                <span>YouTube</span>
            </div>
        </div>
        <div class="icon-card-wrapper" onclick="switchPlatform('Snapchat', this, 'Paste Snapchat Link Here!', 'Save HD Snapchat Stories and Videos Instantly')">
            <div class="icon-card">
                <i class="fa-brands fa-snapchat"></i>
                <span>Snapchat</span>
            </div>
        </div>
        <div class="icon-card-wrapper" onclick="switchPlatform('Facebook', this, 'Paste Facebook Link Here!', 'Download HD Facebook Reels & Public Videos')">
            <div class="icon-card">
                <i class="fa-brands fa-facebook"></i>
                <span>Facebook</span>
            </div>
        </div>
    </div>

    <!-- Main Dynamic Rainbow Card -->
    <div class="main-card-wrapper">
        <div class="main-card">
            <h1 id="platformTitle">TikTok Downloader</h1>
            <p class="hero-desc" id="platformDesc">Download No-Watermark TikTok Videos Ultra Fast</p>
            
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="Paste Tiktok Link Here!">
            </div>

            <!-- Quality Selector -->
            <div class="quality-title"><i class="fa-solid fa-sliders"></i> SELECT QUALITY:</div>
            <div class="quality-grid">
                <div class="quality-btn-wrapper active" onclick="setQuality(this)">
                    <button class="quality-btn"><i class="fa-solid fa-hd"></i> 1080p HD</button>
                </div>
                <div class="quality-btn-wrapper" onclick="setQuality(this)">
                    <button class="quality-btn"><i class="fa-solid fa-wand-magic-sparkles"></i> 1080p Ultra</button>
                </div>
                <div class="quality-btn-wrapper" onclick="setQuality(this)">
                    <button class="quality-btn"><i class="fa-solid fa-music"></i> Audio MP3</button>
                </div>
            </div>

            <!-- Download Button -->
            <div class="btn-download-wrapper" onclick="startProcess()">
                <button type="button" class="btn-download">
                    <i class="fa-solid fa-bolt"></i>
                    <span>Download Video</span>
                </button>
            </div>
            
            <div id="statusText"></div>
        </div>
    </div>

    <!-- In-App Ad Modal -->
    <div class="ad-modal" id="adModal">
        <div class="ad-header">
            <button class="close-ad-btn" id="closeAdBtn" onclick="closeAdModal()">Reward in (5s)</button>
        </div>
        <iframe id="adFrame" class="ad-iframe" src=""></iframe>
    </div>

    <script>
        const adSmartLink = "https://araplhn.org/4/718787872bf62907dd99606e2222b500";
        let currentPlatform = 'TikTok';
        let countdownTimer;

        function switchPlatform(platform, element, placeholderText, descText) {
            currentPlatform = platform;
            
            // Remove active status from all icons
            document.querySelectorAll('.icon-card-wrapper').forEach(card => card.classList.remove('active'));
            element.classList.add('active');

            // Update Dynamic Titles & Placeholders
            document.getElementById('platformTitle').innerText = platform + ' Downloader';
            document.getElementById('platformDesc').innerText = descText;
            document.getElementById('urlInput').placeholder = placeholderText;
        }

        function setQuality(wrapperElement) {
            document.querySelectorAll('.quality-btn-wrapper').forEach(b => b.classList.remove('active'));
            wrapperElement.classList.add('active');
        }

        function startProcess() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const statusText = document.getElementById('statusText');

            if (!urlInput) {
                statusText.style.color = '#ff0055';
                statusText.innerHTML = '⚠️ Please paste a valid link first!';
                return;
            }

            showRewardedAd();
        }

        function showRewardedAd() {
            const modal = document.getElementById('adModal');
            const iframe = document.getElementById('adFrame');
            const closeBtn = document.getElementById('closeAdBtn');
            
            iframe.src = adSmartLink;
            modal.style.display = 'flex';

            let timeLeft = 5;
            closeBtn.disabled = true;
            closeBtn.innerText = `Reward in (${timeLeft}s)`;

            countdownTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    closeBtn.innerText = `Reward in (${timeLeft}s)`;
                } else {
                    clearInterval(countdownTimer);
                    closeBtn.disabled = false;
                    closeBtn.innerText = '✕ Save File';
                    closeBtn.style.background = '#00ff88';
                    closeBtn.style.color = '#000';
                }
            }, 1000);
        }

        function closeAdModal() {
            document.getElementById('adModal').style.display = 'none';
            document.getElementById('adFrame').src = '';
            fetchDownload();
        }

        async function fetchDownload() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const statusText = document.getElementById('statusText');

            statusText.style.color = '#00ffff';
            statusText.innerHTML = '⏳ Extracting HD Video link...';

            try {
                const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                const data = await res.json();

                if (data && data.code === 0) {
                    statusText.style.color = '#00ff88';
                    statusText.innerHTML = `
                        ✅ File Ready!<br><br>
                        <a href="${data.data.play}" style="display:inline-block; padding:14px 26px; background:linear-gradient(90deg, #00ff88, #00ffff); color:#000; font-weight:900; border-radius:12px; text-decoration:none; box-shadow:0 0 15px #00ff88;" target="_blank" download>
                            <i class="fa-solid fa-download"></i> SAVE HD FILE
                        </a>
                    `;
                } else {
                    statusText.style.color = '#ff0055';
                    statusText.innerHTML = '❌ Invalid or private link.';
                }
            } catch (err) {
                statusText.style.color = '#ff0055';
                statusText.innerHTML = '❌ Server connection error.';
            }
        }
    </script>
</body>
</html>
