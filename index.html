        <div class="quality-selector">

    <script>
        let selectedQuality = 'hd';
        let requiredAds = 1;

        const qualityButtons = document.querySelectorAll('.quality-btn');
        qualityButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                qualityButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedQuality = btn.getAttribute('data-quality');
                requiredAds = parseInt(btn.getAttribute('data-ads'));
            });
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const urlInput = document.getElementById('urlInput').value.trim();
            const statusText = document.getElementById('statusText');

            if (!urlInput) {
                statusText.style.color = '#ff0055';
                statusText.innerText = 'Please paste a valid TikTok link first!';
                return;
            }

            statusText.style.color = '#00ffff';
            statusText.innerText = 'Preparing download... You need to watch ' + requiredAds + ' ad(s) for ' + selectedQuality.toUpperCase() + '.';
        });
